name: Vertex Providers Bot

on:
  push:
    branches:
      - main
      - master
    paths:
      - "providers/**"
      - "manifest.json"
      - "build-bundled.js"
      - "provider-build-metadata.js"
      - "package.json"
      - ".github/workflows/vertex-providers-bot.yml"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vertex-providers-bot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: Build, Test & Auto-Commit dist/
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'push' ||
      (!contains(github.event.head_commit.message, '[skip ci]') &&
      github.actor != 'github-actions[bot]')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Validate manifest and build metadata
        run: |
          node -e '
            const fs = require("fs");
            const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            if (!Array.isArray(manifest)) throw new Error("manifest.json must be an array");
            for (const entry of manifest) {
              if (!entry.value || !entry.version) {
                throw new Error("Every manifest entry requires value and version");
              }
            }
            console.log("Validated", manifest.length, "Vertex manifest entries.");
          '
          node --test tests/provider-build-metadata.test.js

      - name: Build and unit-test Vertex provider bundles
        run: npm run test:unit

      - name: Auto-commit compiled dist/ bundles
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "Vertex Providers Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/
          if git diff --cached --quiet; then
            echo "No changes in dist/ to commit."
            exit 0
          fi
          git commit -m "chore(vertex-bot): rebuild dist provider bundles [skip ci]"
          git push
